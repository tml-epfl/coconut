model_id: multihop_reasoner
model_init: scratch
model_config_overrides:
  n_embd: 256
  n_layer: 3
  n_head: 4
  use_mlp: true
  max_position_embeddings: 1024

# Custom tokenizer path (set to use a smaller vocabulary tokenizer)
# Train a custom tokenizer with: python train_tokenizer.py --output_dir tokenizers/tml_custom
# Then set: tokenizer_path: tokenizers/tml_custom
tokenizer_path: null
