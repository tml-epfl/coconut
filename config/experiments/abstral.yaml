# @package _global_

defaults:
  - /config
  - override /data: synthetic
  - override /model: gpt2_scratch_small
  - _self_

model:
  tokenizer_path: tokenizers/abstral
  model_config_overrides:
    n_embd: 128
    n_head: 4
    n_layer: 2
    use_mlp: true

method:
  abstral: true

run:
  experiment_name: abstral
  n_abstral_tokens: 50

training:
  epochs_per_stage: 100
  eval_every_n_epochs: 10
  lr: 0.001
  weight_decay: 0
  num_epochs: 400
  batch_size_training: 256

data:
  dataset:
    online: true
    method: tml
    max_names: 100
    max_entities: 1000
    unified_names_entities: true
    num_nodes:
      - [3, 9]
      - [5, 15]
      - [7, 21]
      - [9, 27]
    num_layers: 
      - [2, 3]
      - [2, 3]
      - [2, 4]
      - [2, 5]
    num_edges:
      - [3, 15]
      - [5, 25]
      - [7, 35]
      - [9, 45]
    dist: unif
    length: 0
    min_length: 1
    max_length: 1
    neg_length: 0
    min_neg_length: 1
    max_neg_length: 1
    epochs_per_length: 100