# Base Coconut training settings (ProsQA / synthetic defaults)
c_thought: 1
epochs_per_stage: 5
max_latent_stage: 6
pad_latent_to_max: true
uniform_prob: 0.0
reset_optimizer: true
batch_size_training: 32
gradient_accumulation_steps: 2  # ProntoQA uses 1
num_epochs: 50                  # GSM8K uses 25
lr: 0.0001
weight_decay: 0.01

# Dataset-specific overrides to match previous per-dataset files:
# - GSM8K: c_thought=2, epochs_per_stage=3, max_latent_stage=3,
#   gradient_accumulation_steps=1, num_epochs=25
# - ProntoQA: gradient_accumulation_steps=1 (others same as base)

