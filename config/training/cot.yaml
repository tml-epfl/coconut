# Base CoT training settings (ProsQA / synthetic defaults)
c_thought: 0
epochs_per_stage: 5
max_latent_stage: 6
pad_latent_to_max: true
uniform_prob: 0.0
reset_optimizer: true        # GSM8K uses false
batch_size_training: 32
batch_size_generation: 1
gradient_accumulation_steps: 1  # GSM8K uses 1
num_epochs: 50                  # GSM8K uses 25
lr: 0.0001
weight_decay: 0.01

# Dataset-specific overrides to match previous per-dataset files:
# - GSM8K: epochs_per_stage=1, max_latent_stage=0, reset_optimizer=false,
#   gradient_accumulation_steps=1, num_epochs=25

