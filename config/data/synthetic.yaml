data_type: synthetic
train_path: null
val_path: null
dataset:
  method: tml
  online: True
  max_names: 17 # default for prosqa
  max_entities: 38 # default for prosqa
  unified_names_entities: False # default for prosqa

  size:
    train: 17886
    valid: 300
    test: 500
  # '[min, max]' for unif or '[mean, std]' for 'gauss'
  dist: gauss # 'unif' or 'gauss'
  num_nodes: [20, 3]
  num_layers: [5, 1]
  num_edges: [40, 10]

  # 0 to randomly sample, -1 for max, positive for fixed length
  length: 0
  min_length: 1
  max_length: -1
  neg_length: 0
  min_neg_length: 1
  max_neg_length: -1
  epochs_per_length: 0 # if it is positive and `max` are positive, it increase max_length gradually
  max_trials: 100 # maximum number of trials for rejection sampling