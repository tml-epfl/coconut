data_type: synthetic
train_path: null
val_path: null
dataset:
  method: tml
  online: True
  size:
    train: 17886
    valid: 300
    test: 500
  # '[min, max]' for unif or '[mean, std]' for 'gauss'
  dist: unif # 'unif' or 'gauss'
  num_nodes: [16, 24]
  num_layers: [3, 6]
  num_edges: [20, 60]

  # 0 to randomly sample, -1 for max, positive for fixed length
  length: -1
  min_length: 3
  neg_length: -1
  min_neg_length: 1
  max_trials: 100 # maximum number of trials for rejection sampling