experiment_name: synthetic
outputs_root: outputs/experiments
seed: 0
debug: false
bf16: false
resume: 0
save_only_improve: false
load_model_path: null
only_eval: true
eval_with_visible_steps: false
# sampling / decoding params for evaluation
eval_best_of: 1
eval_sampling_strategy: sample  # options: greedy, sample, beam
eval_temperature: 0.7
eval_top_p: 0.9
eval_num_beams: 4
cot_patterns:
  ignore:
    - '\<\|start-latent\|\>(.*?)\<\|end-latent\|\>'
  match:
    - 'Every\s+(?P<x>.+?)\s+is\s+a\s+(?P<y>.+)\.'
    - '(?P<x>.+?)\s+is\s+a\s+(?P<y>.+)\.'
wandb_entity: tml-coconut
resume_mode: auto
resume_attempt_id: null
signature_ignore_keys: []


